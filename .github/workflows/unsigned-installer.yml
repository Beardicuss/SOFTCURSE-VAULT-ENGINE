name: Build unsigned installer candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unsigned-installer.yml'
      - 'scripts/Build-UnsignedInstaller.ps1'
      - 'installer/**'
      - '**/*.cs'
      - '**/*.xaml'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/packages.lock.json'
      - 'Directory.Build.props'
      - 'LICENSE'
      - 'NOTICE'
      - 'PRIVACY.md'
      - 'SECURITY.md'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build unsigned installer candidate
        shell: pwsh
        run: ./scripts/Build-UnsignedInstaller.ps1
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SoftcurseVaultCleaner-v3.0.0-UNSIGNED
          path: artifacts/unsigned-v3.0.0/
          if-no-files-found: error
          retention-days: 14
