name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore "Win11 Auto-Clean.sln" --locked-mode
      - name: Build with warnings as errors
        run: dotnet build "Win11 Auto-Clean.sln" -c Release --no-restore -warnaserror
      - name: Run safety and update-verification tests
        run: dotnet run --project "SafeCleanupEngine.Tests/SafeCleanupEngine.Tests.csproj" -c Release --no-build
      - name: Audit vulnerable dependencies
        shell: pwsh
        run: |
          $output = dotnet package list --project "Win11 Auto-Clean.csproj" --include-transitive --vulnerable --format json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet vulnerability audit failed.' }
          $json = $output -join "`n"
          $null = $json | ConvertFrom-Json
          $json | Set-Content dependency-audit.json
          if ($json -match '"vulnerabilities"\s*:') { throw 'NuGet reported a vulnerable dependency.' }
      - name: Reject outdated direct dependencies
        shell: pwsh
        run: |
          $output = dotnet package list --project "Win11 Auto-Clean.csproj" --outdated --format json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet outdated-package audit failed.' }
          $json = $output -join "`n"
          $null = $json | ConvertFrom-Json
          if ($json -match '"topLevelPackages"\s*:') { throw 'A direct dependency update is available; review and refresh the lock file.' }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Materialize signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SOFTCURSE_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) { throw 'Signing certificate secret is missing.' }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\softcurse-signing.pfx", [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
      - name: Create signed release
        shell: pwsh
        env:
          SOFTCURSE_SIGNING_PFX: ${{ runner.temp }}\softcurse-signing.pfx
          SOFTCURSE_SIGNING_PASSWORD: ${{ secrets.SOFTCURSE_SIGNING_PASSWORD }}
        run: ./scripts/Release.ps1
      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: 'artifacts/v*/**'
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem "artifacts/${{ github.ref_name }}" -File | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" $files --verify-tag --generate-notes --title "Softcurse Vault Cleaner ${{ github.ref_name }}"
      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Softcurse-Vault-Cleaner-${{ github.ref_name }}
          path: artifacts/${{ github.ref_name }}/
          if-no-files-found: error
